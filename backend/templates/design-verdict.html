<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; font-src 'none'" />
<title>__TITLE__ — Design Council Verdict</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;position:relative;min-height:100vh;background:#fff;color:#3a3a3a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;}
:root{--canvas:#ffffff;--surface-soft:#F7F7F7;--surface-card:#f5f0e0;--hairline:#e5e5e5;--ink:#0a0a0a;--body-strong:#1a1a1a;--body:#3a3a3a;--muted:#465B6B;--brand:#8552F6;--link-purple:#6A40C6;--red:#D13A62;--orange:#F68D2E;--green:#1B8756;--blue:#2C72DE;--lavender:#C2A4FF;--r-xs:2px;--r-sm:4px;--r-md:8px;--r-lg:16px;--r-xl:24px;--r-pill:9999px;}
.dc-wrap{max-width:1200px;margin:32px auto 0;padding:0 24px 0;}
.dc-stage{display:flex;flex-direction:column;align-items:center;gap:14px;}
.dc-canvas{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;}
.dc-image-frame{position:relative;display:inline-block;max-width:100%;border-radius:2px;overflow:hidden;box-shadow:0 24px 38px rgba(0,0,0,0.14);border:1px solid #f2e3ff;background:#fff;line-height:0;}
.dc-image{display:block;max-width:100%;max-height:78vh;height:auto;width:auto;user-select:none;}
.is-loading .dc-pin{opacity:0;pointer-events:none;}
.dc-pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;padding:0;border:none;background:transparent;cursor:pointer;z-index:2;animation:pin-in 360ms cubic-bezier(0.34,1.56,0.64,1) both;}
@keyframes pin-in{from{opacity:0;transform:translate(-50%,-50%) scale(0.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.dc-pin-dot{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,0.95);box-shadow:0 1px 6px rgba(0,0,0,0.32);font-size:11px;font-weight:700;color:#fff;transition:transform .18s ease,box-shadow .18s ease;position:relative;}
.dc-pin-dot::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid currentColor;opacity:0.45;animation:pulse 2.2s ease-out infinite;}
@keyframes pulse{0%{transform:scale(1);opacity:0.45}70%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
.dc-pin:hover .dc-pin-dot{transform:scale(1.2);}
.dc-pin.is-active .dc-pin-dot{transform:scale(1.35);box-shadow:0 0 0 3px rgba(255,255,255,0.85),0 3px 10px rgba(0,0,0,0.32);}
.dc-pin.is-active .dc-pin-dot::after{animation:none;opacity:0;}
.dc-pin--crit .dc-pin-dot{background:var(--red);color:var(--red);}
.dc-pin--high .dc-pin-dot{background:var(--orange);color:var(--orange);}
.dc-pin--med  .dc-pin-dot{background:#c9a227;color:#c9a227;}
.dc-pin--low  .dc-pin-dot{background:var(--green);color:var(--green);}
.dc-pin--good .dc-pin-dot{background:var(--green);color:var(--green);}
.dc-pin--note .dc-pin-dot{background:var(--green);color:var(--green);}
.dc-popover{position:fixed;width:340px;max-height:calc(100vh - 24px);background:#fff;border-radius:12px;box-shadow:0 24px 48px rgba(0,0,0,0.22),0 8px 18px rgba(0,0,0,0.12);z-index:2147483000;display:none;flex-direction:column;overflow:auto;top:20px;left:20px;}
.dc-popover.is-open{display:flex;}
.dc-popover-bar{height:8px;background:#8552F6;flex-shrink:0;}
.dc-popover-body{padding:20px 24px 24px;position:relative;}
.dc-popover-close{position:absolute;top:12px;right:12px;width:24px;height:24px;border:none;background:transparent;font-size:18px;cursor:pointer;color:#465B6B;border-radius:4px;display:flex;align-items:center;justify-content:center;line-height:1;}
.dc-popover-close:hover{background:rgba(88,121,143,0.1);}
.dc-badge{display:flex;align-items:center;gap:4px;padding:6px 0;margin-bottom:0;}
.dc-badge-num{display:flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 7px;border-radius:9999px;background:#1A1F2C;color:#fff;font-family:'SF Pro Text',-apple-system,sans-serif;font-size:12px;font-weight:600;line-height:20px;flex-shrink:0;}
.dc-badge-label{font-family:'SF Pro Text',-apple-system,sans-serif;font-size:12px;font-weight:600;line-height:20px;padding:2px 8px;border-radius:4px;}
.dc-badge-label--crit{background:rgba(209,47,58,0.10);color:#d12f3a;}
.dc-badge-label--high{background:rgba(246,141,46,0.12);color:#b5630f;}
.dc-badge-label--med{background:rgba(201,162,39,0.14);color:#8A6E00;}
.dc-badge-label--low,.dc-badge-label--note{background:rgba(44,114,222,0.10);color:#1c5fb8;}
.dc-badge-label--good{background:rgba(27,135,86,0.12);color:#1b8756;}
.dc-detail-title{font-family:'SF Pro Display',-apple-system,sans-serif;font-size:20px;font-weight:600;color:#0a0a0a;margin:4px 0;line-height:24px;}
.dc-detail-principle{font-family:'SF Pro Text',-apple-system,sans-serif;font-size:12px;font-weight:600;line-height:20px;color:#6a40c6;background:transparent;text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:#8552f6;text-decoration-thickness:1px;text-underline-offset:2px;margin:0 0 4px;}
.dc-detail-comment{font-size:14px;font-weight:400;color:#0a0a0a;line-height:1.6;margin:0;}
.dc-detail-nav{display:flex;gap:8px;margin-top:20px;}
.dc-detail-nav .btn{flex:1;height:32px;background:#F2F6F7;border:none;border-radius:4px;font-size:14px;font-weight:600;color:#0a0a0a;cursor:pointer;}
.dc-detail-nav .btn:hover{background:#e2ecf0;}
.dc-stage-footer{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:16px 0 0;}
.dc-hint{font-size:14px;font-weight:400;color:#465B6B;margin:0;}
.btn-verdict{height:36px;padding:0 20px;background:#8552F6;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .16s;}
.btn-verdict:disabled{background:#C3D4DE;color:#8a9baa;cursor:not-allowed;}
.btn-verdict:hover:not(:disabled){background:#7440e6;}
.dc-verdict-wrap{display:none;position:relative;gap:0;align-items:flex-start;max-width:none;margin:0;padding:32px 120px 80px;}
.dc-verdict-wrap.is-open{display:flex;}
/* Middle vertical guide — matches the left/right guides, spans the section column */
.dc-verdict-wrap.is-open::before{content:'';position:absolute;top:0;bottom:0;left:382px;width:1px;background-image:repeating-linear-gradient(to bottom,rgba(88,121,143,0.34) 0 6px,transparent 6px 12px);pointer-events:none;}
.dc-verdict-left{flex:0 0 262px;display:flex;flex-direction:column;gap:8px;position:sticky;top:24px;}
.dc-verdict-thumb{width:100%;height:170px;border-radius:2px;background:#F7F7F7;overflow:hidden;object-fit:cover;display:block;border:1px solid #f2e3ff;}
.btn-hide-verdict{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;background:transparent;border:1px solid var(--hairline);border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .16s,border-color .16s;}
.btn-hide-verdict:hover{background:rgba(133,82,246,0.06);border-color:var(--brand);color:var(--brand);}
.btn-verdict-info{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;background:transparent;border:1px solid var(--hairline);border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .16s,border-color .16s;}
.btn-verdict-info:hover,.btn-verdict-info.is-open{background:rgba(133,82,246,0.06);border-color:var(--brand);color:var(--brand);}
.btn-download-html{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;background:transparent;border:1px solid var(--hairline);border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:background .16s,border-color .16s;}
.btn-download-html:hover{background:rgba(133,82,246,0.06);border-color:var(--brand);color:var(--brand);}
.btn-publish-web{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%;height:36px;background:var(--brand);border:1px solid var(--brand);border-radius:6px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;cursor:pointer;font-family:inherit;transition:background .16s,border-color .16s;box-sizing:border-box;}
.btn-publish-web:hover{background:#7440e6;border-color:#7440e6;color:#fff;}
.dc-info-panel{background:#fff;border:1px solid var(--hairline);border-radius:6px;padding:12px 14px;display:none;flex-direction:column;gap:6px;}
.dc-info-panel.is-open{display:flex;}
.dc-info-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 4px;}
.dc-info-chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
.dc-info-chip{font-size:12px;font-weight:500;color:var(--muted);background:#f7f7f7;border:1px solid var(--hairline);border-radius:4px;padding:3px 8px;}
.dc-info-date{font-size:11px;color:var(--muted);margin:4px 0 0;}
.dc-verdict-right{flex:1;min-width:0;background:transparent;border:none;border-radius:0;padding:0 0 0 80px;overflow:hidden;}
.dc-verdict-body{font-size:14px;line-height:24px;color:var(--ink);}
.dc-verdict-body h2{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif;font-size:20px;font-weight:600;line-height:24px;color:var(--ink);margin:0 0 8px;padding-bottom:0;border-bottom:none;}
.dc-verdict-body h2:first-child{margin-top:0;}
/* Alternating section blocks + dividers (Figma 48:949) */
.dc-verdict-body .md-section{margin:0;padding:16px;border-top:1px solid rgba(88,121,143,0.22);}
.dc-verdict-body .md-section:last-child{border-bottom:1px solid rgba(88,121,143,0.22);}
.dc-verdict-body .md-section>:last-child{margin-bottom:0;}
.dc-verdict-body .md-section--verdict{background:#f7f7f7;}
.dc-verdict-body .md-section--scorecard{background:#fff;}
.dc-verdict-body .md-section--issues{background:#f7f7f7;}
.dc-verdict-body .md-section--strengths{background:#fff;}
.dc-verdict-body .md-section--next-steps{background:rgba(27,135,86,0.10);}
.dc-verdict-body h3{font-size:16px;font-weight:600;color:var(--ink);margin:14px 0 8px;}
.dc-verdict-body p{margin:8px 0;}
.dc-verdict-body ul,.dc-verdict-body ol{padding-left:22px;margin:8px 0;}
.dc-verdict-body li{margin:6px 0;}
.dc-verdict-body strong{color:var(--ink);}
.dc-verdict-body table{width:100%;border-collapse:collapse;margin:8px 0 0;font-size:14px;}
.dc-verdict-body th,.dc-verdict-body td{text-align:left;padding:8px 12px;border-bottom:1px solid rgba(88,121,143,0.22);vertical-align:top;}
.dc-verdict-body th:not(:last-child),.dc-verdict-body td:not(:last-child){border-right:1px solid rgba(88,121,143,0.22);}
.dc-verdict-body thead th{background:rgba(44,114,222,0.10);color:#0a0a0a;font-family:'SF Pro Text',-apple-system,sans-serif;font-size:12px;font-weight:600;line-height:20px;text-align:center;text-transform:none;letter-spacing:0;border-color:rgba(44,114,222,0.10);}
.dc-verdict-body tbody td:first-child{text-align:center;color:#000;font-weight:400;text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:#8552f6;text-decoration-thickness:1px;text-underline-offset:2px;}
.dc-verdict-body tbody td:nth-child(2){text-align:center;}
.dc-verdict-body tbody tr:last-child td{border-bottom:none;}
.dc-verdict-body blockquote{margin:16px 0;padding:12px 18px;border-left:4px solid #1a3a3a;background:#f5f0e0;border-radius:0 8px 8px 0;color:#1a1a1a;}
.p-ref{cursor:help;transition:opacity .15s ease;}
.p-ref:hover{opacity:.72;}
#p-tip{position:fixed;z-index:9999;display:none;align-items:center;gap:10px;background:#fff;border:1px solid var(--hairline);border-radius:12px;padding:9px 14px;box-shadow:0 6px 24px rgba(10,10,10,0.12);font-family:Inter,sans-serif;font-size:12px;white-space:nowrap;pointer-events:auto;opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease;}
.p-tip-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;outline:1px solid rgba(0,0,0,0.08);}
.p-tip-name{font-weight:600;color:var(--ink);}
.p-tip-link{color:var(--muted);text-decoration:none;font-weight:500;border-bottom:1px solid var(--hairline);transition:color .15s;}
.p-tip-link:hover{color:var(--ink);}
.chip{background:var(--canvas);border:1px solid var(--hairline);color:var(--muted);font-size:12px;font-weight:500;padding:3px 12px;border-radius:var(--r-pill);}
.footer-chip{background:var(--surface-card);border:1px solid var(--hairline);color:var(--muted);font-size:12px;font-weight:500;padding:3px 12px;border-radius:var(--r-pill);}
footer{margin-top:80px;background:var(--surface-soft);border-top:1px solid var(--hairline);padding:40px 32px;text-align:center;}
.seal{font-size:14px;font-weight:600;color:var(--ink);}
footer p{margin:6px 0 0;font-size:13px;color:var(--muted);}
.footer-context{font-size:13px;color:var(--muted);margin:8px 0 0;}
.context-label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;padding:2px 9px;background:#f5f0e0;border:1px solid var(--hairline);border-radius:9999px;margin-right:8px;color:var(--muted);}
.footer-council{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
/* Vertical dashed guide lines — 120px from each edge, full content height (Figma) */
.viewport-guides{position:absolute;top:0;bottom:0;left:0;right:0;z-index:5;pointer-events:none;}
.viewport-guide{position:absolute;top:0;bottom:0;width:1px;border:none;background-image:repeating-linear-gradient(to bottom,rgba(88,121,143,0.34) 0 6px,transparent 6px 12px);}
.viewport-guide--left{left:120px;}
.viewport-guide--right{right:120px;}
@media (max-width:820px){.viewport-guide--left{left:56px;}.viewport-guide--right{right:56px;}}
@media (max-width:768px){
  .dc-wrap{padding:0 16px 0;}
  .dc-verdict-wrap{padding:24px 16px 60px;flex-direction:column;}
  .dc-verdict-wrap.is-open::before{display:none;}
  .dc-verdict-left{flex:none;width:100%;position:static;}
  .dc-verdict-thumb{height:120px;}
  .dc-verdict-right{padding:16px 0 0;}
  .dc-pin{width:32px;height:32px;}
  .dc-pin-dot{width:30px;height:30px;font-size:13px;}
  .viewport-guide{display:none;}
  footer{padding:24px 16px;}
}</style>
</head>
<body>
<div class="viewport-guides" aria-hidden="true">
  <span class="viewport-guide viewport-guide--left"></span>
  <span class="viewport-guide viewport-guide--right"></span>
</div>
<div class="dc-wrap" id="dc-wrap">
  <div class="dc-stage" id="dc-stage">
    <div class="dc-canvas is-loading" id="dc-canvas">
      <div class="dc-image-frame" id="dc-frame">
        <img class="dc-image" id="dc-img" src="__IMG_SRC__" alt="Reviewed design" draggable="false" />
        __PINS_HTML__
      </div>
      <div class="dc-popover" id="dc-popover" role="dialog" aria-label="Annotation detail">
        <div class="dc-popover-bar"></div>
        <div class="dc-popover-body" id="panel-body">
          <button class="dc-popover-close" onclick="closePanel()" aria-label="Close">×</button>
        </div>
      </div>
    </div>
    <div class="dc-stage-footer">
      <p class="dc-hint" id="dc-hint">__HINT__</p>
      <button class="btn-verdict" id="btn-verdict" onclick="toggleVerdict()" disabled>View full verdict</button>
    </div>
  </div>
</div>
<div class="dc-verdict-wrap" id="dc-verdict-wrap">
  <div class="dc-verdict-left">
    <img class="dc-verdict-thumb" src="__IMG_SRC__" alt="Design thumbnail" />
    <button type="button" class="btn-hide-verdict" onclick="toggleVerdict()">Hide verdict</button>
    <button type="button" class="btn-verdict-info" id="btn-verdict-info" onclick="toggleCouncilInfo()" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M7 6.5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="7" cy="4.5" r="0.75" fill="currentColor"/>
      </svg>
      Council details
    </button>
    <div class="dc-info-panel" id="dc-info-panel" role="dialog" aria-label="Design Critique Council">
      <p class="dc-info-title">⛰️ Design Critique Council</p>
      <div class="dc-info-chips">__FOOTER_CHIPS__</div>
      <p class="dc-info-date">__DATELINE__</p>
    </div>
    <button type="button" class="btn-download-html" onclick="downloadCurrentHtml()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 2v7m0 0l-2.5-2.5M7 9l2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2.5 10.5v1a.5.5 0 00.5.5h8a.5.5 0 00.5-.5v-1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      Download HTML
    </button>
    <a href="https://github.com/kkchimpy/design-critique" target="_blank" rel="noopener noreferrer" class="btn-publish-web">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/>
        <path d="M1.5 7h11M7 1.5c1.5 1.5 2.2 3.5 2.2 5.5s-.7 4-2.2 5.5c-1.5-1.5-2.2-3.5-2.2-5.5s.7-4 2.2-5.5z" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      Design Critique Project
    </a>
  </div>
  <div class="dc-verdict-right">
    <div class="dc-verdict-body" id="dc-verdict-body"></div>
  </div>
</div>
<footer>
  <span class="seal">⛰️ LLM Design Council</span>
  __CONTEXT_HTML__
  <div class="footer-council">__FOOTER_CHIPS__</div>
  <p>__DATELINE__</p>
</footer>
<div id="p-tip"></div>
<script>
(function () {
  'use strict';
  var PINS = __PINS_JSON__;
  var VERDICT_HTML = __VERDICT_JSON__;
  var SEV_LABEL = {"0":"Note","1":"Minor","2":"Moderate","3":"Major","4":"Critical"};
  var TONES     = {"0":"note","1":"low","2":"med","3":"high","4":"crit"};
  var activePin = null;
  var showingVerdict = false;
  var canvas      = document.getElementById('dc-canvas');
  var popover     = document.getElementById('dc-popover');
  var panelBody   = document.getElementById('panel-body');
  var btnV        = document.getElementById('btn-verdict');
  var verdictWrap = document.getElementById('dc-verdict-wrap');
  var verdictBody = document.getElementById('dc-verdict-body');
  var wrap        = document.getElementById('dc-wrap');

  setTimeout(function () {
    canvas.classList.remove('is-loading');
    if (btnV) btnV.disabled = false;
  }, 1800);

  document.querySelectorAll('.dc-pin').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (canvas.classList.contains('is-loading')) return;
      var idx = parseInt(btn.dataset.index, 10);
      if (activePin === idx && popover.classList.contains('is-open')) {
        closePanel();
      } else {
        showingVerdict = false;
        activePin = idx;
        openPinPanel(idx, btn);
      }
    });
  });

  function pinTone(pin) { return pin.category === 'strength' ? 'good' : (TONES[String(pin.severity)] || 'med'); }
  function sevLabel(pin) { return pin.category === 'strength' ? 'Strength' : (SEV_LABEL[String(pin.severity)] || 'Note'); }

  function openPinPanel(idx, pinBtn) {
    var pin = PINS[idx], tone = pinTone(pin), lbl = sevLabel(pin);
    var closeBtn = '<button class="dc-popover-close" onclick="closePanel()" aria-label="Close">\xd7</button>';
    panelBody.innerHTML = closeBtn + renderPinDetail(pin, tone, lbl, idx);
    positionPopover(pinBtn);
    popover.classList.add('is-open');
    document.querySelectorAll('.dc-pin').forEach(function (b) {
      b.classList.toggle('is-active', parseInt(b.dataset.index, 10) === idx);
    });
  }

  function positionPopover(pinBtn) {
    var pinRect = pinBtn.getBoundingClientRect();
    var popW = 340;
    var popH = Math.min(360, window.innerHeight - 24);
    var margin = 12;
    var left = pinRect.right + 14;
    if (left + popW > window.innerWidth - margin) left = pinRect.left - popW - 14;
    if (left < margin) left = margin;
    var top = pinRect.top + pinRect.height / 2 - popH / 2;
    if (top + popH > window.innerHeight - margin) top = window.innerHeight - popH - margin;
    if (top < margin) top = margin;
    popover.style.top  = top  + 'px';
    popover.style.left = left + 'px';
  }

  function renderPinDetail(pin, tone, lbl, idx) {
    var navBtns = PINS.length > 1
      ? '<div class="dc-detail-nav"><button class="btn" onclick="prevPin()">‹ Previous</button><button class="btn" onclick="nextPin()">Next ›</button></div>'
      : '';
    return '<div class="dc-badge">'
      + '<span class="dc-badge-num">' + (idx + 1) + '</span>'
      + '<span class="dc-badge-label dc-badge-label--' + tone + '">' + escHtml(lbl) + '</span></div>'
      + '<h3 class="dc-detail-title">' + escHtml(pin.title || 'Observation') + '</h3>'
      + (pin.principle ? '<p class="dc-detail-principle">' + escHtml(pin.principle) + '</p>' : '')
      + (pin.comment   ? '<p class="dc-detail-comment">'   + escHtml(pin.comment)   + '</p>' : '')
      + navBtns;
  }

  window.prevPin = function () {
    activePin = (activePin - 1 + PINS.length) % PINS.length;
    openPinPanel(activePin, document.querySelector('.dc-pin[data-index="' + activePin + '"]'));
  };
  window.nextPin = function () {
    activePin = (activePin + 1) % PINS.length;
    openPinPanel(activePin, document.querySelector('.dc-pin[data-index="' + activePin + '"]'));
  };

  window.toggleVerdict = function () {
    if (showingVerdict) {
      showingVerdict = false;
      verdictWrap.classList.remove('is-open');
      wrap.style.display = '';
      if (btnV) btnV.textContent = 'View full verdict';
    } else {
      showingVerdict = true;
      closePanel();
      verdictBody.innerHTML = VERDICT_HTML;
      verdictWrap.classList.add('is-open');
      wrap.style.display = 'none';
      if (btnV) btnV.textContent = 'Hide verdict';
    }
  };

  window.closePanel = function () {
    popover.classList.remove('is-open');
    activePin = null;
    document.querySelectorAll('.dc-pin').forEach(function (b) { b.classList.remove('is-active'); });
  };

  window.toggleCouncilInfo = function () {
    var infoPanel = document.getElementById('dc-info-panel');
    var btn = document.getElementById('btn-verdict-info');
    if (!infoPanel || !btn) return;
    var isOpen = infoPanel.classList.toggle('is-open');
    btn.classList.toggle('is-open', isOpen);
    btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  };

  window.downloadCurrentHtml = function () {
    var docHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    var blob = new Blob([docHtml], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (document.title || 'design-verdict').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });
  document.addEventListener('click', function (e) {
    if (popover.classList.contains('is-open') && !popover.contains(e.target) && !e.target.closest('.dc-pin')) closePanel();
  });

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var tip = document.getElementById('p-tip');
  var hideTimer = null;
  function showTip(el) {
    clearTimeout(hideTimer);
    var r = {
      label: el.dataset.principleLabel || 'Design principle',
      link: el.dataset.principleUrl || '',
    };
    tip.innerHTML = '<span class="p-tip-name">' + escHtml(r.label) + '</span>'
      + (r.link ? '<a class="p-tip-link" href="' + escHtml(r.link) + '" target="_blank" rel="noopener noreferrer">Learn more ↗</a>' : '');
    tip.style.visibility = 'hidden'; tip.style.opacity = '0'; tip.style.display = 'flex';
    requestAnimationFrame(function () {
      var rect = el.getBoundingClientRect(), tw = tip.getBoundingClientRect().width, th = tip.getBoundingClientRect().height;
      var top = rect.top - th - 10, left = rect.left + rect.width / 2 - tw / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
      tip.style.top = top + 'px'; tip.style.left = left + 'px';
      tip.style.visibility = 'visible'; tip.style.opacity = '1'; tip.style.transform = 'translateY(0)';
    });
  }
  function hideTip() {
    tip.style.opacity = '0'; tip.style.transform = 'translateY(6px)';
    hideTimer = setTimeout(function () { tip.style.display = 'none'; }, 220);
  }
  tip.addEventListener('mouseenter', function () { clearTimeout(hideTimer); });
  tip.addEventListener('mouseleave', hideTip);
  document.addEventListener('mouseover', function (e) {
    var ref = e.target.closest && e.target.closest('.p-ref');
    if (ref) showTip(ref); else hideTip();
  });
  tip.style.display = 'none'; tip.style.transform = 'translateY(6px)';
})();
</script>
</body>
</html>
