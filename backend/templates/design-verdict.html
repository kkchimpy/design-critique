<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'; font-src 'none'" />
<title>__TITLE__ — Design Council Verdict</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
__TOKENS_CSS__

/* ── Shell (mirrors the live vanilla UI) ─────────────────────────────── */
body{margin:0;background:var(--surface-alt);color:var(--color-type-default);
  font:400 16px/1.55 var(--font-sans);-webkit-font-smoothing:antialiased;}
.x-wrap{max-width:1100px;margin:0 auto;padding:24px 24px 48px;}
.x-head h1{margin:0 0 4px;font-size:20px;font-weight:600;line-height:1.4;}
.x-head .ctx{margin:0 0 12px;font-size:16px;color:var(--color-type-secondary);}
.x-app{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;}
.x-app .app{margin:0;font-size:18px;font-weight:600;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:4px 10px;border-radius:4px;font-size:14px;font-weight:600;line-height:1.4;white-space:nowrap;}
.chip.major{background:var(--pill-major-bg);color:var(--pill-major-fg);}
.chip.moderate{background:var(--pill-moderate-bg);color:var(--pill-moderate-fg);}
.chip.topic{background:var(--pill-topic-bg);color:var(--pill-topic-fg);}

/* ── Canvas + pins (20px, severity tiers, same as live) ───────────────── */
.x-canvas{position:relative;background:var(--surface-alt);}
.x-canvas img{display:block;width:100%;height:auto;}
.x-pins{position:absolute;inset:0;}
.pin{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid #fff;
  cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s ease;}
.pin:hover{transform:scale(1.2);}
.pin:focus-visible{outline:2px solid var(--info);outline-offset:2px;}
.pin.critical{background:var(--severity-critical);}
.pin.major{background:var(--severity-major);}
.pin.moderate{background:#d9a514;}
.pin.minor{background:#8a8f98;}
.pin.good{background:var(--severity-note);}
.x-hint{margin:8px 0 0;font-size:13px;color:var(--color-type-secondary);}

/* ── Pin card (same structure as live) ────────────────────────────────── */
.pin-card{position:absolute;z-index:6;width:min(280px,72%);max-height:82%;overflow-y:auto;
  background:var(--color-surface-default);border:1px solid var(--color-border-strong);border-radius:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.28);padding:14px 14px 12px;
  transform:translate(14px,-50%);transform-origin:left center;animation:pin-pop .22s ease both;}
.pin-card.flip{transform:translate(calc(-100% - 14px),-50%);transform-origin:right center;animation-name:pin-pop-flip;}
.pin-card[hidden]{display:none;}
@keyframes pin-pop{from{opacity:0;transform:translate(14px,-50%) scale(.94);}to{opacity:1;transform:translate(14px,-50%) scale(1);}}
@keyframes pin-pop-flip{from{opacity:0;transform:translate(calc(-100% - 14px),-50%) scale(.94);}to{opacity:1;transform:translate(calc(-100% - 14px),-50%) scale(1);}}
.pin-card-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.pin-card-index{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  padding:0 5px;border-radius:4px;background:var(--surface-chip);font-size:12px;font-weight:600;}
.pin-card-sev{padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;}
.pin-card-sev.critical{background:var(--severity-critical);}
.pin-card-sev.major{background:var(--severity-major);}
.pin-card-sev.moderate{background:#d9a514;}
.pin-card-sev.minor{background:#8a8f98;}
.pin-card-sev.good{background:var(--severity-note);}
.pin-card-x{margin-left:auto;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:4px;background:none;font-size:15px;cursor:pointer;color:inherit;}
.pin-card-x:hover{background:var(--surface-alt);}
.pin-card-title{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.4;}
.pin-card-principle{margin:0 0 8px;font-size:13px;line-height:1.5;color:#1f7a5c;text-decoration:underline;text-underline-offset:2px;}
.pin-card-text{margin:0;font-size:14px;line-height:1.55;}
.pin-card-body.swap{filter:blur(3px);opacity:.6;}
.pin-card-nav{display:flex;justify-content:space-between;margin-top:12px;}
.pin-card-nav button{width:40px;height:36px;display:flex;align-items:center;justify-content:center;
  border:0;border-radius:4px;background:var(--surface-chip);color:var(--color-type-secondary);
  font-size:20px;line-height:1;cursor:pointer;}
.pin-card-nav button:hover:not(:disabled){color:var(--color-type-default);}
.pin-card-nav button:disabled{opacity:.4;cursor:default;}

/* ── CTA bar ──────────────────────────────────────────────────────────── */
.x-bar{display:flex;margin:16px 0 0;}
.x-bar button{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;border:0;border-radius:0;
  background:var(--color-interactive-primary);color:var(--color-interactive-on-primary);
  font:600 16px/1.4 var(--font-sans);cursor:pointer;}
.x-bar button:hover{opacity:.88;}

/* ── Sections (same order/classes as live details) ────────────────────── */
.x-details{margin-top:16px;}
body.is-preview .x-details{display:none;}
.sec{display:flex;flex-direction:column;gap:8px;padding:16px;border-bottom:1px dashed var(--color-line-dashed);}
.sec.soft{background:var(--color-surface-default);}
.sec h2{margin:0;font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.3px;}
.sec.next h2{color:var(--info);}
.sec h3{margin:0;font-size:16px;font-weight:600;line-height:1.4;color:var(--color-type-secondary);}
.sec p{margin:0;font-size:15px;line-height:1.55;color:var(--color-type-secondary);}
.sec ul{margin:0;padding-left:1.5em;font-size:15px;line-height:1.55;color:var(--color-type-secondary);}
.sec b,.sec strong{font-weight:700;color:var(--color-type-default);}
.sec table{border-collapse:collapse;width:100%;font-size:14px;}
.sec th,.sec td{border:1px solid var(--color-border);padding:6px 8px;text-align:left;}
.sec .p-ref{text-decoration:underline dotted;text-underline-offset:2px;}

/* ── Footer ───────────────────────────────────────────────────────────── */
footer{margin-top:32px;padding-top:16px;border-top:1px dashed var(--color-line-dashed);text-align:center;}
.seal{font-size:14px;font-weight:600;}
footer p{margin:6px 0 0;font-size:13px;color:var(--color-type-secondary);}
.footer-context{font-size:13px;}
.context-label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 9px;background:var(--surface-alt);border:1px solid var(--color-border);margin-right:8px;}
.footer-council{margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.footer-chip{background:var(--surface-alt);border:1px solid var(--color-border);font-size:12px;font-weight:500;
  padding:3px 12px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
</style>
</head>
<body class="is-preview">
<div class="x-wrap">
  <header class="x-head">
    <h1>__TITLE__</h1>
    <p class="ctx">__PAGE_CONTEXT__</p>
    <div class="x-app">
      <p class="app">__APP_NAME__</p>
      <div class="chips">__CHIPS_HTML__</div>
    </div>
  </header>
  <div class="x-canvas" id="x-canvas">
    <img src="__IMG_SRC__" alt="Reviewed design" draggable="false" />
    <div class="x-pins" id="x-pins">__PINS_HTML__</div>
    <div class="pin-card" id="x-card" hidden></div>
  </div>
  <p class="x-hint">__HINT__</p>
  <div class="x-bar">
    <button type="button" id="x-toggle"><span class="l1">View verdict details</span><span class="l2" hidden>Back to preview</span></button>
  </div>
  <div class="x-details" id="x-details">__SECTIONS_HTML__</div>
  <footer>
    <span class="seal">⛰️ LLM Design Council</span>
    __CONTEXT_HTML__
    <div class="footer-council">__FOOTER_CHIPS__</div>
    <p>__DATELINE__</p>
  </footer>
</div>
<script>
(function () {
  'use strict';
  var PINS = __PINS_JSON__;
  var pins = Array.isArray(PINS) ? PINS.map(function (p, i) {
    var sev = Number(p.severity != null ? p.severity : 2), cls, label;
    if (p.category === 'strength') { cls = 'good'; label = 'Good'; }
    else if (sev >= 4) { cls = 'critical'; label = 'Critical'; }
    else if (sev === 3) { cls = 'major'; label = 'Major'; }
    else if (sev === 2) { cls = 'moderate'; label = 'Moderate'; }
    else { cls = 'minor'; label = 'Minor'; }
    return { i: i, cls: cls, label: label,
      x: p.x != null ? p.x : 50, y: p.y != null ? p.y : 50,
      title: p.title || ('Annotation ' + (i + 1)),
      sub: p.principle || p.heuristic || '', body: p.comment || p.body || '' };
  }) : [];
  var active = null;
  var card = document.getElementById('x-card');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function open(i) {
    if (!pins.length) return;
    active = Math.max(0, Math.min(pins.length - 1, i));
    paint(false);
  }
  function close() { active = null; card.hidden = true; }
  function step(d) {
    if (active === null) return;
    var n = active + d;
    if (n < 0 || n >= pins.length) return;
    active = n;
    paint(true);
  }
  function paint(swapping) {
    var p = pins[active];
    if (!p) return;
    card.innerHTML =
      '<div class="pin-card-top"><span class="pin-card-index">' + (active + 1) + '</span>'
      + '<span class="pin-card-sev ' + p.cls + '">' + esc(p.label) + '</span>'
      + '<button class="pin-card-x" type="button" data-c="close" aria-label="Close annotation">✕</button></div>'
      + '<div class="pin-card-body' + (swapping ? ' swap' : '') + '">'
      + '<p class="pin-card-title">' + esc(p.title) + '</p>'
      + (p.sub ? '<p class="pin-card-principle">' + esc(p.sub) + '</p>' : '')
      + (p.body ? '<p class="pin-card-text">' + esc(p.body) + '</p>' : '') + '</div>'
      + '<div class="pin-card-nav">'
      + '<button type="button" data-c="prev" aria-label="Previous annotation"' + (active === 0 ? ' disabled' : '') + '>‹</button>'
      + '<button type="button" data-c="next" aria-label="Next annotation"' + (active === pins.length - 1 ? ' disabled' : '') + '>›</button></div>';
    card.style.top = 'clamp(70px, ' + p.y + '%, calc(100% - 70px))';
    card.style.left = p.x + '%';
    card.classList.toggle('flip', p.x > 55);
    card.hidden = false;
    if (swapping) {
      var body = card.querySelector('.pin-card-body');
      if (body) requestAnimationFrame(function () {
        requestAnimationFrame(function () { body.classList.remove('swap'); });
      });
    }
  }
  document.getElementById('x-pins').addEventListener('click', function (e) {
    var b = e.target.closest('.pin');
    if (b) open(Number(b.dataset.i));
  });
  card.addEventListener('click', function (e) {
    var b = e.target.closest('[data-c]');
    if (!b) return;
    if (b.dataset.c === 'close') close();
    else if (b.dataset.c === 'prev') step(-1);
    else if (b.dataset.c === 'next') step(1);
  });
  document.getElementById('x-toggle').addEventListener('click', function () {
    var details = document.body.classList.toggle('is-preview') === false;
    document.body.classList.toggle('is-details', details);
    var btn = document.getElementById('x-toggle');
    btn.querySelector('.l1').hidden = details;
    btn.querySelector('.l2').hidden = !details;
    if (details) document.getElementById('x-details').scrollIntoView();
  });
  document.addEventListener('keydown', function (e) {
    if (active === null) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
})();
</script>
</body>
</html>
