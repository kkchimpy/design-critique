<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Design Council Gallery — AI design critiques and verdicts." />
<title>Design Council — Critiques</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  --canvas: #f6f5f4;
  --surface: #ffffff;
  --ink: #0a0a0a;
  --body: #3a3a3a;
  --muted: #465b6b;
  --faint: #a39e98;
  --hairline: #e6e6e6;
  --hairline-soft: rgba(88,121,143,.22);
  --primary: #0075de;
  --primary-active: #005bab;
  --purple: #8552f6;
  --purple-deep: #391c57;
  --pink: #ff64c8;
  --orange: #dd5b00;
  --orange-deep: #793400;
  --teal: #2a9d99;
  --green: #1aae39;
  --red: #d13a62;
  --yellow: #c9a227;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-pill: 9999px;
  --shadow-soft: 0 .175px 1.041px rgba(0,0,0,.01), 0 .8px 2.925px rgba(0,0,0,.02), 0 2.025px 7.847px rgba(0,0,0,.027), 0 4px 18px rgba(0,0,0,.04);
  --shadow-lift: 0 2px 8px rgba(0,0,0,.02), 0 12px 34px rgba(0,0,0,.07);
}
html, body {
  margin: 0;
  min-width: 320px;
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.viewport { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }

/* ── Card grid (Figma 34:309) ───────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.card:focus-within { outline: 2px solid var(--primary); outline-offset: 2px; }
.card-img-wrap { position: relative; aspect-ratio: 4/3; background: var(--canvas); overflow: hidden; }
.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-img-wrap .placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: var(--faint); font-size: 13px; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-title {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-context {
  margin: 0;
  color: var(--body);
  font-size: 13px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-date { margin: 0; color: var(--muted); font-size: 12px; }

/* ── Tag pills (Figma 34:196 palette) ──────────────────────────────────── */
.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  line-height: 1;
}
.tag--crit { background: rgba(221,91,0,.16); color: var(--orange-deep); }
.tag--high { background: rgba(255,100,200,.20); color: var(--purple-deep); }
.tag--med  { background: rgba(214,182,246,.50); color: var(--purple-deep); }
.tag--pin  { background: rgba(0,117,222,.10); color: var(--primary-active); }
.tag--cat  { background: var(--canvas); color: var(--body); border: 1px solid var(--hairline); }

/* ── Empty / loading states ─────────────────────────────────────────────── */
.empty {
  margin-top: 48px;
  padding: 40px 24px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--hairline);
  border-radius: var(--r-lg);
  background: var(--surface);
}
.empty h2 { margin: 0 0 6px; color: var(--ink); font-size: 18px; font-weight: 600; }

@media (max-width: 640px) {
  .viewport { padding: 16px 16px 32px; }
  .grid { grid-template-columns: 1fr; gap: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}
</style>
</head>
<body>
<main class="viewport">
  <section class="grid" id="grid" aria-label="Published design critiques">__GALLERY_CARDS_HTML__</section>
  <div class="empty" id="empty" hidden>
    <h2>No critiques published yet</h2>
    <p>Once someone publishes a verdict, it'll appear here.</p>
  </div>
</main>
<script>
(function () {
  'use strict';
  var SUPABASE_URL = 'https://ybnptwflkjxqhuzyrdky.supabase.co';
  var SUPABASE_ANON = 'eyJhbG...d3iE';
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, function (character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
    });
  }

  function tagHtml(item) {
    var out = '';
    if (item.crit_count) out += '<span class="tag tag--crit">' + item.crit_count + ' critical</span>';
    if (item.high_count) out += '<span class="tag tag--high">' + item.high_count + ' major</span>';
    if (item.med_count)  out += '<span class="tag tag--med">'  + item.med_count  + ' moderate</span>';
    if (item.annotation_count && !(item.crit_count || item.high_count || item.med_count)) {
      out += '<span class="tag tag--pin">' + item.annotation_count + ' pins</span>';
    }
    out += '<span class="tag tag--cat">' + escapeHtml(item.category || 'Design') + '</span>';
    return out;
  }

  function cardHtml(item) {
    var img = item.image
      ? '<img src="' + escapeHtml(item.image) + '" alt="' + escapeHtml(item.title || 'Design critique') + '" loading="lazy" />'
      : '<div class="placeholder">No screenshot</div>';
    var url = escapeHtml(item.url || '#');
    var date = item.date ? '<p class="card-date">' + escapeHtml(item.date) + '</p>' : '';
    return '<a class="card" href="' + url + '">' +
      '<div class="card-img-wrap">' + img + '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHtml(item.title || 'Design Critique') + '</h3>' +
        '<p class="card-context">' + escapeHtml(item.context || 'Visual UX/UI design evaluation.') + '</p>' +
        '<div class="card-meta">' + tagHtml(item) + '</div>' +
        date +
      '</div>' +
    '</a>';
  }

  /* Initial render: server already injected cards via __GALLERY_CARDS_HTML__.
     We only need to hydrate any extra records published after build time. */
  function collectServerCards() {
    var nodes = Array.from(grid.querySelectorAll('.card'));
    nodes.forEach(function (node, i) {
      if (!node.dataset.title) {
        var t = node.querySelector('.card-title')?.textContent || '';
        node.dataset.title = t.trim();
      }
      node.dataset.position = String(i + 1);
    });
  }

  function recordToItem(record, position) {
    var annotations = Array.isArray(record.annotations) ? record.annotations : [];
    return {
      title: record.title || 'Design Critique',
      context: record.context || 'Visual UX/UI design evaluation.',
      url: record.html_url || '#',
      image: record.image_url || '',
      crit_count: Number(record.crit_count || 0),
      high_count: Number(record.high_count || 0),
      med_count: Number(record.med_count || 0),
      annotation_count: annotations.length,
      category: record.category || 'Design',
      date: record.created_at ? new Date(record.created_at).toISOString().slice(0, 10) : '',
      position: position,
    };
  }

  async function hydratePublishedCritiques() {
    try {
      var response = await fetch(SUPABASE_URL + '/rest/v1/verdicts?select=*&order=created_at.desc&apikey=' + SUPABASE_ANON);
      if (!response.ok) return;
      var records = await response.json();
      if (!Array.isArray(records) || !records.length) return;
      var known = new Set(Array.from(grid.querySelectorAll('.card')).map(function (n) { return (n.dataset.title || '').trim(); }));
      var position = grid.querySelectorAll('.card').length;
      records.forEach(function (record) {
        if (known.has((record.title || '').trim())) return;
        position += 1;
        grid.insertAdjacentHTML('beforeend', cardHtml(recordToItem(record, position)));
      });
    } catch (error) {
      console.warn('Published critique sync failed', error);
    } finally {
      empty.hidden = grid.children.length > 0;
    }
  }

  collectServerCards();
  empty.hidden = grid.children.length > 0;
  hydratePublishedCritiques();
}());
</script>
</body>
</html>
